<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyper Fullscreen Image</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      width: 100vw;
      min-height: 100vh;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      min-width: 100vw;
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }
    .fullscreen-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 0;
      overflow: hidden;
    }
    .fullscreen-bg img {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      object-position: center center;
      display: block;
      max-width: none;
      max-height: none;
      min-width: 100vw;
      min-height: 100vh;
      background: #000;
      user-select: none;
      pointer-events: none;
    }
    @media (max-width: 768px) {
      .fullscreen-bg img {
        width: 100vw;
        height: 100vh;
        min-width: 100vw;
        min-height: 100vh;
      }
    }
    @media (max-width: 480px) {
      .fullscreen-bg img {
        width: 100vw;
        height: 100vh;
        min-width: 100vw;
        min-height: 100vh;
      }
    }
  </style>
</head>
<body>
  <div class="fullscreen-bg">
    <img src="/assets/images/hyper.jpeg" alt="Hyper" loading="lazy" decoding="async" />
  </div>
</body>
</html>
